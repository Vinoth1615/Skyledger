services:
  postgres:
    image: postgres:16
    container_name: skyledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyledger
      POSTGRES_PASSWORD: skyledger123
      POSTGRES_DB: skyledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: